
# Identificación del proyecto en SonarCloud
sonar.projectKey=ericricaldi_perceptron-simple
sonar.organization=ericraldi
sonar.projectName=Perceptron Simple
sonar.projectVersion=1.0

# Directorios del proyecto
sonar.sources=src,main.py
sonar.tests=tests

# Identificación de los archivos de prueba
sonar.test.inclusions=tests/**/*.py

# Excluir las pruebas del cálculo de cobertura
sonar.coverage.exclusions=tests/**

# Configuración de Python
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Reporte de cobertura generado por pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
