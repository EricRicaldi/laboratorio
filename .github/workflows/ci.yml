
name: CI - Travel ADK Multiagent

on:
  push:
    branches:
      - LaboratoriosSI
      - main
      - master
      - 'feature/**'

  pull_request:
    branches:
      - LaboratoriosSI
      - main
      - master

jobs:
  validate:
    name: Tests, Ruff and SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: travel-adk-multiagent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run pytest --cov=travel_assistant --cov-report=xml:coverage.xml -v

      - name: Run Ruff
        run: poetry run ruff check .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: travel-adk-multiagent
