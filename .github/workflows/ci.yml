
name: CI - Perceptron Simple

on:
  push:
    branches:
      - LaboratoriosSI
  pull_request:
    branches:
      - LaboratoriosSI

jobs:
  test:
    name: Ejecutar pruebas y análisis de calidad
    runs-on: ubuntu-latest

    steps:
      # Descargar el código del repositorio.
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # Configurar Python.
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instalar dependencias con versiones específicas y paquetes binarios.
      - name: Instalar pytest y cobertura
        run: python -m pip install --only-binary=:all: pytest==8.4.2 pytest-cov==6.2.1

      # Ejecutar las pruebas y generar el reporte de cobertura.
      - name: Ejecutar pruebas del perceptrón
        run: >
          python -m pytest
          --cov=laboratorio-perceptron/src
          --cov=laboratorio-perceptron/main
          --cov-report=xml:laboratorio-perceptron/coverage.xml
          laboratorio-perceptron/tests -v

      # Analizar el proyecto en SonarCloud.
      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PERCEPTRON }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: laboratorio-perceptron
