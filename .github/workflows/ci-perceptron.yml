
name: CI - Perceptron Simple

on:
  push:
    branches:
      - LaboratoriosSI
  pull_request:
    branches:
      - LaboratoriosSI

jobs:
  test:
    name: Ejecutar pruebas y análisis de calidad
    runs-on: ubuntu-latest

    steps:
      # Descargar el código del repositorio.
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # Configurar Python.
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instalar las herramientas necesarias.
      - name: Instalar pytest y cobertura
        run: python -m pip install pytest pytest-cov

      # Ejecutar las pruebas y generar el reporte XML.
      - name: Ejecutar pruebas del perceptrón
        working-directory: laboratorio-perceptron
        run: python -m pytest --cov=src --cov=main --cov-report=xml:coverage.xml tests -v

      # Analizar el proyecto en SonarCloud.
      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PERCEPTRON }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: laboratorio-perceptron
