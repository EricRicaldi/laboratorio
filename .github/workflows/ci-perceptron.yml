
name: CI - Perceptron Simple

on:
  push:
    branches:
      - LaboratoriosSI
  pull_request:
    branches:
      - LaboratoriosSI

jobs:
  test:
    name: Ejecutar pruebas y análisis de calidad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Ejecutar pruebas del perceptrón
        working-directory: laboratorio-perceptron
        run: python -m pytest tests -v

      - name: Analizar código con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: laboratorio-perceptron
